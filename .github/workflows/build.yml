name: Build and Test

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Scala.js / munit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: coursier/cache-action@v8

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: "24"
          distribution: temurin

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g terser

      - name: Cache Playwright dependencies
        id: cache-pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('playwrightVersion.mill') }}
          restore-keys: |
            playwright-${{ runner.os }}-


      - name: Install Playwright
        if: steps.cache-pw.outputs.cache-hit != 'true'
        run: ./mill PlaywrightSetup install --with-deps

      - name: formatCheck
        run: ./mill mill.scalalib.scalafmt.ScalafmtModule/checkFormatAll __.sources

      - name: Install npm dependencies (jsdom)
        run: npm ci

      - name: Compile (JS backward-compat)
        run: ./mill mathlify.compile

      - name: Compile (JVM cross-platform)
        run: ./mill mathlify.jvm.compile

      - name: Compile (JS cross-platform)
        run: ./mill mathlify.js.compile

      - name: Compile (Native cross-platform)
        run: ./mill mathlify.native.compile

      - name: Run tests (JS backward-compat)
        run: ./mill mathlify.test

      - name: Run tests (JVM cross-platform)
        run: ./mill mathlify.jvm.test

      - name: Run tests (JS cross-platform)
        run: ./mill mathlify.js.test

      - name: Run tests (Native cross-platform)
        run: ./mill mathlify.native.test

      - name: Run tests
        run: ./mill appTest
      - run: ./mill example.assembleSite


      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/example/assembleSite.dest

      - if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
