name: Build and Test

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Scala.js / munit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: "24"
          distribution: temurin

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g terser
      - name: Cache Mill
        uses: actions/cache@v4
        with:
          path: |
            ~/.mill
            ~/.ivy2/cache
            ~/.cache/coursier
          key: ${{ runner.os }}-mill-${{ hashFiles('.mill-version') }}-ivy-${{ hashFiles('build.mill') }}
          restore-keys: |
            ${{ runner.os }}-mill-${{ hashFiles('.mill-version') }}-ivy-
            ${{ runner.os }}-mill-


      - name: Cache Playwright dependencies
        id: cache-pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('playwrightVersion.mill') }}
          restore-keys: |
            playwright-${{ runner.os }}-


      - name: Install Playwright
        if: steps.cache-pw.outputs.cache-hit != 'true'
        run: ./mill PlaywrightSetup install --with-deps

      - name: formatCheck
        run: ./mill mill.scalalib.scalafmt.ScalafmtModule/checkFormatAll __.sources

      - name: Install npm dependencies (jsdom)
        run: npm ci

      - name: Compile
        run: ./mill mathlify.compile

      - name: Run tests
        run: ./mill mathlify.test

      - name: Run tests
        run: ./mill appTest
      - run: ./mill example.publish

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/example/publish.dest

      - id: deployment
        uses: actions/deploy-pages@v4
